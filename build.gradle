plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    // Litematica + malilib from Modrinth's maven
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings line and no modImplementation: 26.x is unobfuscated.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "maven.modrinth:litematica:${project.litematica_version}"
    compileOnly "maven.modrinth:malilib:${project.malilib_version}"
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
